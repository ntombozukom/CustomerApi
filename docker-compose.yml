services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customerapi
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=customerapi;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      ConnectionStrings__Redis: "redis:6379"
      BasicAuth__Username: "${AUTH_USERNAME:-admin}"
      BasicAuth__Password: "${AUTH_PASSWORD:-Admin@123}"
      Encryption__Key: "${ENCRYPTION_KEY:-dev-only-change-in-production}"
      Swagger__Title: "Customer API"
      Swagger__ContactName: "Zuko Malanti"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - customerapi-net

  db:
    image: postgres:16-alpine
    container_name: customerapi-db
    environment:
      POSTGRES_DB: customerapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerapi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - customerapi-net

  redis:
    image: redis:7-alpine
    container_name: customerapi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - customerapi-net

volumes:
  postgres-data:

networks:
  customerapi-net:
    driver: bridge
